name: Build E.V Android APKs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ai:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify and unpack AI project
        run: |
          set -e
          unzip -t EV-AI-Assistant.zip
          mkdir -p build-input/ai
          unzip -o EV-AI-Assistant.zip -d build-input/ai
      - name: Build AI Assistant APK
        run: gradle --no-daemon -p build-input/ai assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: EV-AI-Assistant-APK
          path: build-input/ai/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
