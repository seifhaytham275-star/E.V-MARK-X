name: Build E.V Android APKs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify and unpack projects
        shell: bash
        run: |
          set -e
          mkdir -p build-input
          unzip -t EV-AI-Assistant.zip
          unzip -o EV-AI-Assistant.zip -d build-input/ai
          echo "AI project archive verified"
          unzip -t EV-Wallet.zip || true
          unzip -t EV-Calories.zip || true
          echo "Wallet and Calories archives are present but will be checked before build."
      - name: Build AI Assistant APK
        run: |
          cd build-input/ai
          gradle --no-daemon assembleDebug
      - name: Upload AI APK
        uses: actions/upload-artifact@v4
        with:
          name: EV-AI-Assistant-APK
          path: build-input/ai/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
