name: Build EV AI System APK

on:
  push:
    branches:
      - main
      - 'feat/**'
    tags:
      - 'v*'
    paths-ignore:
      - '*.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: EV-AI-System-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish beta GitHub Release for version tags
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: E.V-MARK-7 Platinum ${{ github.ref_name }} beta
          body: |
            ## E.V-MARK-7 Platinum beta

            This is a **debug/beta build** for testing, not a production-signed release.

            - Test the app on your own device before relying on it.
            - Gemini API access, quotas, and pricing depend on your own Google account.
            - Never share your API key.
            - Firebase sign-in/cloud sync requires the project owner's Firebase configuration.
          prerelease: true
          files: app/build/outputs/apk/debug/app-debug.apk
