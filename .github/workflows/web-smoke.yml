name: Web and Worker smoke tests

on:
  push:
    paths:
      - "app.html"
      - "data-lab.html"
      - "tests/**"
      - "cloudflare-worker/**"
      - ".github/workflows/web-smoke.yml"
  pull_request:
    paths:
      - "app.html"
      - "tests/**"
      - "cloudflare-worker/**"
      - ".github/workflows/web-smoke.yml"

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check Cloudflare Worker syntax
        run: node --check cloudflare-worker/src/index.js
      - name: Run workspace and Worker smoke tests
        run: node --test tests/web-smoke.test.cjs cloudflare-worker/test/worker.test.mjs
